name: Daily Automation Report Email

on:
  schedule:
    # 12:00 PM IST (06:30 UTC). GitHub may start scheduled jobs late.
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily-automation-report-email
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Select latest completed smoke report
        id: report
        run: npx ts-node scripts/select-scheduled-email-report.ts
        env:
          REPORT_SITE_DIR: gh-pages-site

      - name: Send noon report email
        timeout-minutes: 10
        run: npm run report:email
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          ENV: STAGE
          TEST_SUITE: smoke
          ALLURE_REPORT_SOURCE_DIR: ${{ steps.report.outputs.report_dir }}
          ALLURE_REPORT_URL: ${{ steps.report.outputs.report_url }}
          ALLURE_REPORT_SITE_URL: ${{ steps.report.outputs.site_url }}
          BUILD_NUMBER: ${{ steps.report.outputs.build_number }}
          REPORT_BROWSER: ${{ steps.report.outputs.browser }}
          REPORT_PUBLISHED_AT: ${{ steps.report.outputs.published_at }}
          REPORT_TIME_ZONE: Asia/Kolkata
