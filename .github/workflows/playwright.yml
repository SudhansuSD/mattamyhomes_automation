name: Playwright Tests

on:
  schedule:
    # Daily smoke run at 03:30 UTC.
    - cron: '30 3 * * *'
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: smoke
        type: choice
        options:
          - ci
          - smoke
          - regression
      env:
        description: Test environment
        required: true
        default: STAGE
        type: choice
        options:
          - STAGE
          - PROD
      location:
        description: Test location
        required: true
        default: CAN
        type: choice
        options:
          - CAN
          - USA

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      TEST_ENV: ${{ github.event.inputs.env || 'STAGE' }}
      TEST_LOCATION: ${{ github.event.inputs.location || 'CAN' }}
      TEST_SUITE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[single-test]') && 'ci' || github.event_name == 'push' && 'regression' || github.event.inputs.suite || 'smoke' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run single CI test
        if: env.TEST_SUITE == 'ci'
        run: npm run test:ci
        env:
          ENV: ${{ env.TEST_ENV }}
          LOCATION: ${{ env.TEST_LOCATION }}

      - name: Run smoke tests
        if: env.TEST_SUITE == 'smoke'
        run: npm run test:smoke
        env:
          ENV: ${{ env.TEST_ENV }}
          LOCATION: ${{ env.TEST_LOCATION }}

      - name: Run regression tests
        if: env.TEST_SUITE == 'regression'
        run: npm run test:regression
        env:
          ENV: ${{ env.TEST_ENV }}
          LOCATION: ${{ env.TEST_LOCATION }}

      - name: Generate Allure HTML report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_SUITE }}-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
