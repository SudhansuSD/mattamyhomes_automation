name: Playwright Tests

on:
  schedule:
    # Daily smoke run at 03:30 UTC.
    - cron: '30 3 * * *'
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: smoke
        type: choice
        options:
          - ci
          - smoke
          - regression
      env:
        description: Test environment
        required: true
        default: STAGE
        type: choice
        options:
          - STAGE
          - PROD
      location:
        description: Test location (ALL runs USA and CAN into one report)
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - CAN
          - USA
      browser:
        description: Browser to run
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

# contents: write is what lets the built-in GITHUB_TOKEN push each build's report
# to the gh-pages branch. Pages is served from that branch, not from an artifact.
permissions:
  contents: write

jobs:
  playwright:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # A job container gets Docker's default 64MB /dev/shm, which is where
      # Chromium puts its renderer's shared memory. The heavier pages here are
      # 350-600KB of SSR HTML, and with 2 workers that ran the renderer out of
      # shm - surfacing as "page.goto: Page crashed" rather than a test failure.
      # --ipc=host is Playwright's documented fix for exactly this.
      options: --ipc=host
    env:
      TEST_ENV: ${{ github.event.inputs.env || 'STAGE' }}
      # ALL (the default, and what scheduled/push runs use) makes the framework
      # run one pass per location and report on both.
      TEST_LOCATION: ${{ github.event.inputs.location || 'ALL' }}
      TEST_SUITE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[single-test]') && 'ci' || github.event.inputs.suite || 'smoke' }}
      # Scheduled and push runs have no inputs, so they fall back to chromium.
      # A firefox/webkit run deselects @chrome-only tests (see run-locations.ts).
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # One retry on CI only. A test that fails then passes is reported by Allure
      # as FLAKY rather than green, so instability stays visible in the trend -
      # which was the reason retries were left at 0 - without a single unstable
      # selector reddening the whole pipeline. Treat every flaky result as a
      # defect to fix, not as a pass.
      PW_RETRIES: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      # Quality gates run BEFORE tests and fail the job loudly (no continue-on-error).
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run single CI test
        if: env.TEST_SUITE == 'ci'
        run: npm run test:ci
        env:
          ENV: ${{ env.TEST_ENV }}
          LOCATION: ${{ env.TEST_LOCATION }}

      - name: Run smoke tests
        if: env.TEST_SUITE == 'smoke'
        run: npm run test:smoke
        env:
          ENV: ${{ env.TEST_ENV }}
          LOCATION: ${{ env.TEST_LOCATION }}

      - name: Run regression tests
        if: env.TEST_SUITE == 'regression'
        run: npm run test:regression
        env:
          ENV: ${{ env.TEST_ENV }}
          LOCATION: ${{ env.TEST_LOCATION }}

      # Pull down every build published so far. This happens BEFORE report
      # generation because the trend history lives on the branch too — storing it
      # there rather than in the Actions cache keeps a report and the history it
      # describes in one commit (they cannot drift) and survives cache eviction.
      # The branch does not exist before the first publish, hence continue-on-error.
      - name: Check out published report site
        if: always()
        id: site-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site

      # History is kept per suite AND environment, so a Regression/PROD report's
      # trend compares against previous Regression/PROD runs only — one shared
      # chain interleaved the suites and read as false flakiness.
      - name: Restore Allure trend history
        if: always()
        run: npm run report:history:restore
        env:
          ENV: ${{ env.TEST_ENV }}
          REPORT_SITE_DIR: gh-pages-site
          # Must name the same stream the publish step below publishes, so the
          # merged report extends the chain rather than starting a new one.
          REPORT_HISTORY_MODE: merged

      # Three reports from one run: a per-platform report each, plus the merged
      # web + mobile report that the email summarises and the site publishes.
      # allure:merge reads whichever results dirs actually have results, so a
      # single-platform run still produces a valid merged report.
      - name: Generate Allure HTML reports
        if: always()
        run: |
          npm run allure:generate
          npm run allure:generate:mobile
          npm run allure:merge
        env:
          ENV: ${{ env.TEST_ENV }}
          # Needed so the report's Environment widget names the location(s)
          # actually covered instead of assuming every location ran.
          LOCATION: ${{ env.TEST_LOCATION }}

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report
          retention-days: 30

      - name: Detect generated Allure site
        if: always()
        id: allure-site
        shell: bash
        run: |
          # The merged report is what gets published; desktop is the fallback for
          # a run where only one platform produced results.
          if [ -f "allure-report/merged/awesome/index.html" ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
            echo "source_dir=allure-report/merged" >> "$GITHUB_OUTPUT"
          elif [ -f "allure-report/desktop/awesome/index.html" ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
            echo "source_dir=allure-report/desktop" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi

      # Publish + push in one step so a rejected push can be retried by rebuilding
      # the site on top of whatever landed in the meantime. Merging the two trees
      # is not safe — builds.json and index.html are generated files that would
      # conflict — but re-running the publish is, because it is idempotent.
      - name: Publish this build to the report site
        if: always() && steps.allure-site.outputs.has_report == 'true'
        id: report-site
        shell: bash
        env:
          ENV: ${{ env.TEST_ENV }}
          LOCATION: ${{ env.TEST_LOCATION }}
          REPORT_SITE_DIR: gh-pages-site
          REPORT_SOURCE_DIR: ${{ steps.allure-site.outputs.source_dir }}
          REPORT_HISTORY_MODE: merged
          BUILD_NUMBER: ${{ github.run_number }}
          # Builds retained per run type + environment pair before the oldest are
          # pruned. Kept modest because GitHub Pages hard-fails above a 1 GB site.
          KEEP_BUILDS_PER_COMBINATION: '10'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=5

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            npm run report:publish

            pushd gh-pages-site > /dev/null

            if [ ! -d .git ]; then
              git init -b gh-pages
              git remote add origin \
                "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A

            if git diff --staged --quiet; then
              echo "No report changes to publish."
              exit 0
            fi

            git commit -q -m \
              "Publish Allure report build #${GITHUB_RUN_NUMBER} (${TEST_SUITE}/${TEST_ENV})"

            if git push origin HEAD:gh-pages; then
              echo "Published on attempt ${attempt}."
              exit 0
            fi

            echo "::warning::Push rejected on attempt ${attempt}/${MAX_ATTEMPTS} — another run published first; rebuilding on top of it."

            # Discard this attempt and reset the tree to what is now on the remote,
            # then loop: the next publish re-adds this build to the newer site.
            git fetch --depth=1 origin gh-pages
            git checkout -q -B gh-pages origin/gh-pages
            popd > /dev/null
          done

          echo "::error::Could not publish the report after ${MAX_ATTEMPTS} attempts."
          exit 1

      - name: Upload Allure results (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_SUITE }}-playwright-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Validate email configuration
        if: always()
        run: |
          echo "EMAIL_HOST configured: ${{ secrets.EMAIL_HOST != '' }}"
          echo "EMAIL_PORT configured: ${{ secrets.EMAIL_PORT != '' }}"
          echo "EMAIL_SECURE configured: ${{ secrets.EMAIL_SECURE != '' }}"
          echo "EMAIL_USER configured: ${{ secrets.EMAIL_USER != '' }}"
          echo "EMAIL_PASSWORD configured: ${{ secrets.EMAIL_PASSWORD != '' }}"
          echo "EMAIL_FROM configured: ${{ secrets.EMAIL_FROM != '' }}"
          echo "EMAIL_TO configured: ${{ secrets.EMAIL_TO != '' }}"
          echo "EMAIL_CC configured: ${{ secrets.EMAIL_CC != '' }}"
          echo "Allure site generated: ${{ steps.allure-site.outputs.has_report == 'true' }}"
          echo "Build report URL: ${{ steps.report-site.outputs.build_url || 'not published' }}"

      - name: Send email report
        if: always()
        run: npm run report:email
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          ENV: ${{ env.TEST_ENV }}
          BROWSER: ${{ env.BROWSER }}
          BUILD_NUMBER: ${{ github.run_number }}
          # Permanent, per-build URL — it keeps working after later runs publish.
          ALLURE_REPORT_URL: ${{ steps.report-site.outputs.build_url }}
          ALLURE_REPORT_SITE_URL: ${{ steps.report-site.outputs.site_url }}
