name: Playwright Tests

on:
  schedule:
    # Daily smoke run at 03:30 UTC.
    - cron: '30 3 * * *'
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: smoke
        type: choice
        options:
          - ci
          - smoke
          - regression
      env:
        description: Test environment
        required: true
        default: STAGE
        type: choice
        options:
          - STAGE
          - PROD
      location:
        description: Test location
        required: true
        default: USA
        type: choice
        options:
          - CAN
          - USA

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  playwright:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      TEST_ENV: ${{ github.event.inputs.env || 'STAGE' }}
      TEST_LOCATION: ${{ github.event.inputs.location || 'USA' }}
      TEST_SUITE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[single-test]') && 'ci' || github.event.inputs.suite || 'smoke' }}
      BROWSER: Chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      # Quality gates run BEFORE tests and fail the job loudly (no continue-on-error).
      - name: Type-check (desktop + mobile)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run single CI test
        if: env.TEST_SUITE == 'ci'
        run: npm run test:ci
        env:
          ENV: ${{ env.TEST_ENV }}
          LOCATION: ${{ env.TEST_LOCATION }}

      - name: Run smoke tests
        if: env.TEST_SUITE == 'smoke'
        run: npm run test:smoke
        env:
          ENV: ${{ env.TEST_ENV }}
          LOCATION: ${{ env.TEST_LOCATION }}

      - name: Run regression tests
        if: env.TEST_SUITE == 'regression'
        run: npm run test:regression
        env:
          ENV: ${{ env.TEST_ENV }}
          LOCATION: ${{ env.TEST_LOCATION }}

      - name: Generate Allure HTML report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report
          retention-days: 30

      - name: Detect generated Allure site
        if: always()
        id: allure-site
        shell: bash
        run: |
          if [ -f "allure-report/desktop/index.html" ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: always() && steps.allure-site.outputs.has_report == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Allure report for GitHub Pages
        if: always() && steps.allure-site.outputs.has_report == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/desktop

      - name: Deploy Allure report to GitHub Pages
        if: always() && steps.allure-site.outputs.has_report == 'true'
        id: deploy-pages
        uses: actions/deploy-pages@v4

      - name: Upload Allure results (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_SUITE }}-playwright-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Validate email configuration
        if: always()
        run: |
          echo "EMAIL_HOST configured: ${{ secrets.EMAIL_HOST != '' }}"
          echo "EMAIL_PORT configured: ${{ secrets.EMAIL_PORT != '' }}"
          echo "EMAIL_SECURE configured: ${{ secrets.EMAIL_SECURE != '' }}"
          echo "EMAIL_USER configured: ${{ secrets.EMAIL_USER != '' }}"
          echo "EMAIL_PASSWORD configured: ${{ secrets.EMAIL_PASSWORD != '' }}"
          echo "EMAIL_FROM configured: ${{ secrets.EMAIL_FROM != '' }}"
          echo "EMAIL_TO configured: ${{ secrets.EMAIL_TO != '' }}"
          echo "EMAIL_CC configured: ${{ secrets.EMAIL_CC != '' }}"
          echo "Allure site generated: ${{ steps.allure-site.outputs.has_report == 'true' }}"
          echo "GitHub Pages URL: ${{ steps.deploy-pages.outputs.page_url || steps.pages.outputs.base_url || 'not deployed' }}"

      - name: Send email report
        if: always()
        run: npm run report:email
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          TEST_ENV: ${{ env.TEST_ENV }}
          BROWSER: ${{ env.BROWSER }}
          ALLURE_REPORT_URL: ${{ steps.deploy-pages.outputs.page_url || steps.pages.outputs.base_url }}
